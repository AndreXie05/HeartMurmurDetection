# Makes the `murmur` package importable from the notebooks (`pip install -e .`, done by environment.yml).
[project]
name = "murmur"
version = "0.1.0"
description = "Heart murmur detection from phonocardiograms (CirCor DigiScope)"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["murmur*"]
